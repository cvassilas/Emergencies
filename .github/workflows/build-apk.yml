name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ICU-Emergencies-v${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ICU-Emergencies-release-apk
          path: ICU-Emergencies-v${{ github.run_number }}.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" "ICU-Emergencies-v${{ github.run_number }}.apk" \
            --title "ICU Emergencies v${{ github.run_number }}" \
            --notes "Release APK built from main at $(git rev-parse --short HEAD). Install via 'install unknown apps'. Uninstall any older debug build first."
